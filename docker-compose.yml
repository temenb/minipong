services:
  postgres:
    container_name: minipong-postgres
    image: postgres:17.6
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  gateway:
    container_name: minipong-gateway
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    env_file:
      - services/gateway/.env
    ports:
      - "3000:3000"
      - "5000:5000"
    volumes:
      - ./shared/logger/src:/usr/src/app/shared/logger/src
      - ./shared/kafka/src:/usr/src/app/shared/kafka/src
      - ./shared/gprc-client-manager/src:/usr/src/app/shared/gprc-client-manager/src
      - ./services/gateway/src:/usr/src/app/services/gateway/src/
      - ./services/gateway/package.json:/usr/src/app/services/gateway/package.json
    command: pnpm dlx turbo run dev --parallel

  auth:
    container_name: minipong-auth
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    env_file:
      - services/auth/.env
    volumes:
      - ./shared/logger/src:/usr/src/app/shared/logger/src
      - ./shared/kafka/src:/usr/src/app/shared/kafka/src
      - ./shared/gprc-client-manager/src:/usr/src/app/shared/gprc-client-manager/src
      - ./services/auth/src:/usr/src/app/services/auth/src/
      - ./services/auth/package.json:/usr/src/app/services/auth/package.json
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: pnpm dlx turbo run dev --parallel

  profile:
    container_name: minipong-profile
    build:
      context: .
      dockerfile: services/profile/Dockerfile
    env_file:
      - services/profile/.env
    volumes:
      - ./shared/logger/src:/usr/src/app/shared/logger/src
      - ./shared/kafka/src:/usr/src/app/shared/kafka/src
      - ./shared/gprc-client-manager/src:/usr/src/app/shared/gprc-client-manager/src
      - ./services/profile/src:/usr/src/app/services/profile/src/
      - ./services/profile/package.json:/usr/src/app/services/profile/package.json
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: pnpm dlx turbo run dev --parallel

  engine:
    container_name: minipong-engine
    build:
      context: .
      dockerfile: services/engine/Dockerfile
    env_file:
      - services/engine/.env
    volumes:
      - ./shared/logger/src:/usr/src/app/shared/logger/src
      - ./shared/kafka/src:/usr/src/app/shared/kafka/src
      - ./shared/gprc-client-manager/src:/usr/src/app/shared/gprc-client-manager/src
      - ./services/engine/src:/usr/src/app/services/engine/src/
      - ./services/engine/package.json:/usr/src/app/services/engine/package.json
    command: pnpm dlx turbo run dev --parallel

  fallout:
    container_name: minipong-fallout
    build:
      context: .
      dockerfile: services/fallout/Dockerfile
    env_file:
      - services/fallout/.env
    volumes:
      - ./shared/logger/src:/usr/src/app/shared/logger/src
      - ./shared/kafka/src:/usr/src/app/shared/kafka/src
      - ./shared/gprc-client-manager/src:/usr/src/app/shared/gprc-client-manager/src
      - ./services/fallout/src:/usr/src/app/services/fallout/src/
      - ./services/fallout/package.json:/usr/src/app/services/fallout/package.json
    command: pnpm dlx turbo run dev --parallel

  kafka:
    container_name: minipong-kafka
    image: bitnami/kafka:4.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_CLUSTER_ID: "kraft-cluster-001"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      ALLOW_PLAINTEXT_LISTENER: yes
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server=localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

